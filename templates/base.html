<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>A&S System POS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            min-height: 100vh;
            margin: 0;
        }
        .sidebar {
            width: 250px;
            background: linear-gradient(180deg, #2c3e50 0%, #34495e 100%);
            padding: 20px;
            box-shadow: 2px 0 8px rgba(0,0,0,0.1);
            color: white;
        }
        .sidebar .brand {
            text-align: center;
            padding: 15px 0;
            margin-bottom: 30px;
            border-bottom: 2px solid rgba(255,255,255,0.1);
        }
        .sidebar .brand h2 {
            font-size: 1.5rem;
            color: #3498db;
            margin: 0;
            font-weight: bold;
        }
        .sidebar .brand .subtitle {
            font-size: 0.75rem;
            color: #bdc3c7;
            margin-top: 5px;
        }
        .sidebar a {
            display: block;
            margin: 8px 0;
            padding: 12px 15px;
            text-decoration: none;
            background-color: rgba(52, 152, 219, 0.1);
            color: #ecf0f1;
            border-radius: 8px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            border-left: 3px solid transparent;
        }
        .sidebar a:hover {
            background-color: #3498db;
            border-left: 3px solid #2980b9;
            transform: translateX(5px);
        }
        .sidebar a.active {
            background-color: #3498db;
            border-left: 3px solid #2980b9;
        }
        .content {
            flex: 1;
            padding: 2rem;
            background-color: #ecf0f1;
        }
        hr {
            margin: 1.5rem 0;
            border-color: rgba(255,255,255,0.2);
        }
        .btn-logout {
            display: block;
            margin-top: 1rem;
            padding: 10px;
            text-align: center;
            background-color: #e74c3c;
            color: #fff;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .btn-logout:hover {
            background-color: #c0392b;
            color: #fff;
        }
        .user-info {
            text-align: center;
            padding: 10px;
            background: rgba(52, 152, 219, 0.1);
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .user-info .user-icon {
            font-size: 2rem;
            margin-bottom: 5px;
        }
        .user-info .user-name {
            font-size: 0.9rem;
            color: #ecf0f1;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="brand">
            <h2>🏢 A&S System</h2>
            <div class="subtitle">POS Multi-Empresa</div>
        </div>
        
        <div class="user-info">
            <div class="user-icon">👤</div>
            <div class="user-name">{{ user }}</div>
        </div>

        <a href="{{ url_for('facturacion') }}">🧾 Facturación</a>
        <a href="{{ url_for('inventario') }}">📋 Inventario</a>
        <a href="{{ url_for('compras') }}">📦 Compras</a>
        <a href="{{ url_for('gastos') }}">💸 Gastos</a>
        <a href="{{ url_for('contabilidad') }}">📊 Contabilidad</a>
        <a href="{{ url_for('resumenes') }}">📈 Reportes</a>
        <hr>
        <a href="{{ url_for('ajustes') }}">⚙️ Configuración</a>
        <a href="{{ url_for('logout') }}" class="btn-logout">🚪 Cerrar sesión</a>
    </div>
    <div class="content">
        {% block content %}{% endblock %}
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
